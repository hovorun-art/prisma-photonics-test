# Template: the nginx image substitutes ${JOB_SERVICE_PORT} and ${JOB_GROUP_SERVICE_PORT} from the
# container environment.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API calls: /api/v1/groups* goes to job-group-service, every other /api/<path> to
    # job-service, each as /<path> (the prefix is stripped).
    location /api/v1/groups {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://job-group-service:${JOB_GROUP_SERVICE_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://job-service:${JOB_SERVICE_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
