# Template: the nginx image substitutes ${JOB_SERVICE_PORT} from the container environment.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API calls: /api/<path> goes to job-service as /<path> (the prefix is stripped).
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://job-service:${JOB_SERVICE_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
