# The whole stack: `docker compose up --build`; several workers:
# `docker compose up --build --scale job-execution-service=3`.
# Variables come from `.env` (copy .env.example); the defaults below match .env.example.
name: ${COMPOSE_PROJECT_NAME:-job-queue}

x-node-healthcheck: &node-healthcheck
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 5s

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobqueue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobqueue}
      POSTGRES_DB: ${POSTGRES_DB:-jobqueue}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  # The job log store; job-service creates its table at startup.
  clickhouse:
    image: clickhouse/clickhouse-server:26.8-alpine
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-jobqueue}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-jobqueue}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-jobqueue}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    ports:
      - '${CLICKHOUSE_HTTP_PORT:-8123}:8123'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:8123/ping']
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: applies the migrations, then exits.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobqueue}:${POSTGRES_PASSWORD:-jobqueue}@postgres:5432/${POSTGRES_DB:-jobqueue}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  job-service:
    build:
      context: .
      target: job-service
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JOB_SERVICE_PORT: ${JOB_SERVICE_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobqueue}:${POSTGRES_PASSWORD:-jobqueue}@postgres:5432/${POSTGRES_DB:-jobqueue}
      REDIS_URL: redis://redis:6379
      CLICKHOUSE_URL: http://${CLICKHOUSE_USER:-jobqueue}:${CLICKHOUSE_PASSWORD:-jobqueue}@clickhouse:8123/${CLICKHOUSE_DB:-jobqueue}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-local-dev-token}
      JOB_SERVICE_RETRY_MIN_DELAY_MS: ${JOB_SERVICE_RETRY_MIN_DELAY_MS:-5000}
      JOB_SERVICE_RETRY_MAX_DELAY_MS: ${JOB_SERVICE_RETRY_MAX_DELAY_MS:-30000}
      JOB_SERVICE_RETRY_CAP_DELAY_MS: ${JOB_SERVICE_RETRY_CAP_DELAY_MS:-300000}
      JOB_SERVICE_RECOVERY_INTERVAL_MS: ${JOB_SERVICE_RECOVERY_INTERVAL_MS:-30000}
      JOB_SERVICE_RECOVERY_MIN_AGE_MS: ${JOB_SERVICE_RECOVERY_MIN_AGE_MS:-30000}
      JOB_SERVICE_RECOVERY_BATCH_SIZE: ${JOB_SERVICE_RECOVERY_BATCH_SIZE:-100}
      JOB_SERVICE_MAX_PROCESSING_MS_EMAIL: ${JOB_SERVICE_MAX_PROCESSING_MS_EMAIL:-30000}
      JOB_SERVICE_MAX_PROCESSING_MS_WEBHOOK: ${JOB_SERVICE_MAX_PROCESSING_MS_WEBHOOK:-30000}
      JOB_SERVICE_MAX_PROCESSING_MS_FLIGHT_TRANSIT: ${JOB_SERVICE_MAX_PROCESSING_MS_FLIGHT_TRANSIT:-60000}
    ports:
      - '${JOB_SERVICE_PORT:-3000}:${JOB_SERVICE_PORT:-3000}'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:$${JOB_SERVICE_PORT}/health']

  # Scalable and with no published port (every replica listens on the same container port) and no
  # database settings: it reaches job state only through job-service's internal API.
  job-execution-service:
    build:
      context: .
      target: job-execution-service
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JOB_EXECUTION_SERVICE_PORT: ${JOB_EXECUTION_SERVICE_PORT:-3001}
      REDIS_URL: redis://redis:6379
      JOB_SERVICE_URL: http://job-service:${JOB_SERVICE_PORT:-3000}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-local-dev-token}
      JOB_QUEUE_LOCK_DURATION_MS: ${JOB_QUEUE_LOCK_DURATION_MS:-30000}
      JOB_QUEUE_STALLED_INTERVAL_MS: ${JOB_QUEUE_STALLED_INTERVAL_MS:-30000}
    depends_on:
      redis:
        condition: service_healthy
      job-service:
        condition: service_healthy
    # Longer than the shutdown grace period (10 s by default), so running jobs can finish first.
    stop_grace_period: 15s
    healthcheck:
      <<: *node-healthcheck
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:$${JOB_EXECUTION_SERVICE_PORT}/health']

  # One-shot: job-group-service's migrations, into its own `job_groups` schema of the same database.
  job-group-service-migrate:
    build:
      context: .
      target: job-group-service-migrate
    environment:
      JOB_GROUP_SERVICE_DATABASE_URL: postgresql://${POSTGRES_USER:-jobqueue}:${POSTGRES_PASSWORD:-jobqueue}@postgres:5432/${POSTGRES_DB:-jobqueue}?schema=job_groups
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # One instance: the poll of running groups is not shared between instances. It reads job-service
  # only through the public job API and needs neither Redis nor the internal service token.
  job-group-service:
    build:
      context: .
      target: job-group-service
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JOB_GROUP_SERVICE_PORT: ${JOB_GROUP_SERVICE_PORT:-3002}
      JOB_GROUP_SERVICE_DATABASE_URL: postgresql://${POSTGRES_USER:-jobqueue}:${POSTGRES_PASSWORD:-jobqueue}@postgres:5432/${POSTGRES_DB:-jobqueue}?schema=job_groups
      JOB_SERVICE_URL: http://job-service:${JOB_SERVICE_PORT:-3000}
    ports:
      - '${JOB_GROUP_SERVICE_PORT:-3002}:${JOB_GROUP_SERVICE_PORT:-3002}'
    depends_on:
      job-group-service-migrate:
        condition: service_completed_successfully
      job-service:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:$${JOB_GROUP_SERVICE_PORT}/health']

  job-ui:
    build:
      context: .
      target: job-ui
    environment:
      JOB_SERVICE_PORT: ${JOB_SERVICE_PORT:-3000}
      JOB_GROUP_SERVICE_PORT: ${JOB_GROUP_SERVICE_PORT:-3002}
    ports:
      - '${JOB_UI_PORT:-8080}:80'
    depends_on:
      job-service:
        condition: service_healthy
      # Started, not healthy: nginx only needs the name to resolve; the group pages show their
      # error states while job-group-service is not ready.
      job-group-service:
        condition: service_started
    healthcheck:
      <<: *node-healthcheck
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:80/']

volumes:
  postgres-data:
  clickhouse-data:
