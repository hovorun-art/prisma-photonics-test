schema: spec-flow

# Project facts for every artifact. The flow's own rules (decisions, approval, test first, task groups)
# live in openspec/schemas/spec-flow/schema.yaml and CLAUDE.md; keep only what is specific to this product.
context: |
  Job Queue Service (interview task): job-service (NestJS REST API, owns the Job aggregate and job
  logs), job-execution-service (NestJS, takes jobs from a BullMQ/Redis queue and runs them; domain
  modules notifications, webhooks, flight-transit, batch-processing), web (React + Vite, Tailwind +
  shadcn/ui, TanStack Query, Leaflet). Postgres via Prisma is the source of truth; Redis only holds
  the queue. Contracts are Zod schemas in packages/contracts. TypeScript strict, npm workspaces,
  Node 26, Vitest, ESLint + Prettier, Docker Compose.
  Architecture: DDD + onion per module (domain, application, infrastructure, presentation; the domain
  imports no framework); interfaces first, bound through DI tokens; modules talk only through public
  interfaces so each can become its own microservice. Time and randomness come through injected ports.
  Errors are our own classes with stable codes, handled by code, never by message.
  Specs describe user-visible behaviour and edge cases (API responses, UI, job outcomes), not
  implementation.
  Language: English only in all artifacts; other languages only in translation files (e.g. locales/).
  Checks: the CHECK_CMDS in .claude/flow.conf.

