# Project settings for the spec-driven flow. Sourced (bash) by the hooks in .claude/hooks/.
# Fill these in for the project's stack. An empty value turns that check off.

# Branch that holds the approved specs and receives the merged work.
MAIN_BRANCH=main

# Checks run by the Stop hook, in order; the first failure is fed back to Claude.
# They are skipped until CHECKS_REQUIRE exists, so a project without code yet is not blocked.
CHECKS_REQUIRE=package.json
CHECK_CMDS=(
  "npm run --silent typecheck"
  "npm run --silent lint"
  "npm test --silent"
)

# Linter run on each file Claude edits (the file path is appended), and which extensions it covers.
LINT_FILE_CMD="node_modules/.bin/eslint --no-warn-ignored"
LINT_FILE_EXT="ts|tsx|js|jsx|mjs"

# Dependency install for a fresh worktree of a parallel group (skipped when DEPS_DIR already exists there).
INSTALL_CMD="npm install --silent"
DEPS_DIR=node_modules

# Strict test first: 1 = the tdd-guard hook blocks edits to source files (SRC_PATTERN) until a test file
# (TEST_PATTERN) has changed on the branch. Off by default; the TDD rules in CLAUDE.md apply either way.
TDD_STRICT=0
SRC_PATTERN='^src/'
TEST_PATTERN='(\.test|\.spec)\.|(^|/)(tests?|__tests__)/'

# English-only rule: 1 = on. Other languages are allowed only under TRANSLATIONS_DIR, in paths matching
# LANGUAGE_IGNORE (a regex, e.g. '(^|/)fixtures/'; empty = none) and on lines marked "allow-non-english".
ENGLISH_ONLY=1
TRANSLATIONS_DIR=locales
LANGUAGE_IGNORE=''

# Folders never scanned for changes, language or staleness (besides .git, .claude and openspec).
IGNORED_DIRS="node_modules dist build"
